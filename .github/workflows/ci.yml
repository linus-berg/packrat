name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Build (warnings, including naming rules, are errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    needs: test
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44", "45"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          rpm-build rpmlint dotnet-sdk-10.0 systemd-rpm-macros systemd
          git tar gzip

      - uses: actions/checkout@v7

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=1
          else
            version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
            # Sorts below the final "1" release of the same version.
            release="0.${GITHUB_RUN_NUMBER}.git${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build RPMs
        env:
          PACKRAT_VERSION: ${{ steps.version.outputs.version }}
          PACKRAT_RELEASE: ${{ steps.version.outputs.release }}
          RPM_TOPDIR: ${{ github.workspace }}/artifacts/rpmbuild
        run: packaging/build-rpm.sh

      - name: rpmlint
        run: >
          rpmlint -r packaging/packrat.rpmlintrc
          artifacts/rpmbuild/RPMS/noarch/*.rpm
          artifacts/rpmbuild/SRPMS/*.rpm

      - name: Install and smoke test
        run: |
          dnf install -y artifacts/rpmbuild/RPMS/noarch/*.rpm
          packrat --version
          systemd-analyze verify /usr/lib/systemd/system/packrat@.service
          # The shipped config has no directories yet: must exit with
          # EX_CONFIG (78), which the unit does not restart on.
          set +e
          packrat
          code=$?
          set -e
          test "$code" -eq 78

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: |
            artifacts/rpmbuild/RPMS/noarch/*.rpm
            artifacts/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "PackRat $GITHUB_REF_NAME"
          --generate-notes
          dist/*.rpm
